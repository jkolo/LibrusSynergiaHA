dismiss_message_notification:
  name: Odrzuć powiadomienie o wiadomości
  description: >
    Wycisza powiadomienie o wiadomości w Home Assistant (notification_dismissed=True).
    NIE wpływa na status odczytu w Librusie — w przeglądarce dziennika dalej
    będzie widoczna jako nowa. Stan przeżywa restart HA.
  fields:
    entry:
      name: Konto Librus
      required: true
      selector:
        config_entry:
          integration: librus_apix
    message_href:
      name: Identyfikator wiadomości (href)
      description: >
        Numeryczny ID wiadomości — widoczny w atrybucie `href` sensora
        wiadomości (np. state_attr('sensor.librus_jan_kowalski_wiadomosci',
        'messages')[0].href).
      required: true
      example: "12345"
      selector:
        text:

restore_message_notification:
  name: Przywróć powiadomienie o wiadomości
  description: Usuwa flagę notification_dismissed — powiadomienie pojawi się ponownie.
  fields:
    entry:
      name: Konto Librus
      required: true
      selector:
        config_entry:
          integration: librus_apix
    message_href:
      name: Identyfikator wiadomości (href)
      required: true
      selector:
        text:

clear_dismissed_notifications:
  name: Wyczyść wszystkie odrzucone powiadomienia
  description: Usuwa wszystkie flagi notification_dismissed dla wybranego konta.
  fields:
    entry:
      name: Konto Librus
      required: true
      selector:
        config_entry:
          integration: librus_apix

fetch_message_content:
  name: Pobierz treść wiadomości
  description: >
    Pobiera pełną treść wiadomości z Librusa i zwraca w response_variable
    (content, author, title, date).

    UWAGA PRIVACY: pobranie treści SERVER-SIDE oznacza wiadomość jako
    przeczytaną w Librusie. W przeglądarce dziennika ikona "nowa" zniknie.
    Drugi rodzic na osobnym koncie nie jest dotknięty. Service automatycznie
    ustawia notification_dismissed=True.
  fields:
    entry:
      name: Konto Librus
      required: true
      selector:
        config_entry:
          integration: librus_apix
    message_href:
      name: Identyfikator wiadomości (href)
      description: >
        Numeryczny ID wiadomości — widoczny w atrybucie `href` sensora wiadomości.
      required: true
      example: "12345"
      selector:
        text:

list_messages:
  name: Lista wiadomości
  description: >
    Zwraca w response_variable stronę nagłówków wiadomości z lokalnego cache
    integracji (sender, title, date, unread, has_attachment, href) oraz
    has_more i total_count. Nie odpytuje Librusa i nie oznacza wiadomości
    jako przeczytanych. Używane przez kartę librus-messages-card.
  fields:
    entry:
      name: Konto Librus
      required: true
      selector:
        config_entry:
          integration: librus_apix
    offset:
      name: Przesunięcie
      description: Ile najnowszych wiadomości pominąć (paginacja).
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    count:
      name: Liczba wiadomości
      description: Ile wiadomości zwrócić (1–100).
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: box

download_attachment:
  name: Pobierz załącznik
  description: >
    Pobiera załącznik wiadomości z Librusa i zwraca w response_variable
    filename, content_type oraz data (base64). URL załącznika pochodzi z pola
    attachments odpowiedzi akcji fetch_message_content.
  fields:
    entry:
      name: Konto Librus
      required: true
      selector:
        config_entry:
          integration: librus_apix
    attachment_url:
      name: URL załącznika
      description: >
        Wartość attachments[].url z odpowiedzi fetch_message_content.
      required: true
      selector:
        text:
